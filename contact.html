<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Programming School">
  <meta property="og:title" content="Programming School - Contact">
  <meta property="og:description" content="Get in touch with our team.">
  <meta name="twitter:card" content="summary_large_image">
  <title>Contact - Programming School</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header>
    <div class="container">
      <span class="logo">Programming School</span>
      <nav>
        <a href="index.html">Home</a>
        <a href="bmodel.html">Business Model</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="termsofservice.html">Terms of Service</a>
      </nav>
    </div>
  </header>

  <section class="container form-section">
    <h2>Contact Us</h2>
    <form action="mailto:info@example.com" method="post" enctype="text/plain">
      <div class="form-group">
        <label for="name">Name</label><br>
        <input type="text" id="name" name="name" required class="form-field">
      </div>
      <div class="form-group">
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required class="form-field">
      </div>
      <div class="form-group">
        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="5" class="form-field"></textarea>
      </div>
      <button type="submit" class="btn">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2024 Programming School</p>
  </footer>

  <div id="cookie-banner" class="cookie-banner">
    <span>This site uses cookies to enhance your experience.</span>
    <div>
      <button id="accept-cookies">Accept</button>
      <a href="privacy.html" class="btn">Learn more</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
